<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tapis de Court</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@800&display=swap">
<style>
/* Layout: the hall from above. Blue courts on a navy floor, assembly point along the right wall. */
:root {
  color-scheme: dark;
  --floor: #0a1f44; --floor-deep: #071631; --mat: #006fd6; --mat-free: #0f3468;
  --tape: #ffffff; --tape-soft: #cfe5ff; --club: #0080f4; --star: #ffd23f; --ok: #3ddc84; --warn: #ffb020; --lost: #c8102e;
  --stencil: "Big Shoulders Stencil", "Barlow Condensed", "Arial Narrow", sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --u: min(calc(100vw / 192), calc(100vh / 108));
  --pad-x: max(calc(1.6 * var(--u)), env(safe-area-inset-left, 0px));
}
:root[data-season="noel"] { --floor: #0b1b33; --floor-deep: #071225; --mat: #0f5c43; --mat-free: #143a3a; --club: #c8102e }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; margin: 0 }
body { background: var(--floor-deep); color: var(--tape); font-family: var(--label); font-weight: 600; overflow: hidden }
::selection { background: var(--tape); color: var(--floor) }
.hall { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: calc(1.2 * var(--u));
  padding-block: calc(1.4 * var(--u)); padding-left: var(--pad-x);
  padding-right: max(calc(1.6 * var(--u)), env(safe-area-inset-right, 0px)); max-width: calc(192 * var(--u)); margin: 0 auto }

.strip { display: flex; align-items: center; gap: calc(2.4 * var(--u)); min-width: 0 }
.logo { width: calc(13.6 * var(--u)); aspect-ratio: 299 / 177; flex: none; background: var(--tape);
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat }
.strip h1 { font-size: calc(4.2 * var(--u)); font-weight: 700; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: .01em }
.strip p { margin: 0; font-size: calc(2.3 * var(--u)); color: var(--tape-soft); font-weight: 500 }
.right { margin-left: auto; display: flex; align-items: center; gap: calc(2.8 * var(--u)) }
.drift { font-size: calc(2.5 * var(--u)) }
.preview { font-size: calc(1.9 * var(--u)); color: var(--tape-soft); font-weight: 500 }
.clock { font-weight: 700; font-size: calc(6 * var(--u)); line-height: .9; font-variant-numeric: tabular-nums }

.floor { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: calc(1.2 * var(--u)); min-height: 0 }
.courts { display: grid; grid-template-columns: repeat(var(--courts, 5), minmax(0, 1fr)); gap: calc(1.2 * var(--u)); min-height: 0 }

.court { position: relative; background: var(--mat); overflow: hidden; display: grid;
  grid-template-rows: calc(7.6 * var(--u)) minmax(0, 1fr); padding: calc(.7 * var(--u)) calc(1.3 * var(--u)) calc(.8 * var(--u));
  transition: background-color .6s cubic-bezier(.16, 1, .3, 1) }
.court.free { background: var(--mat-free) }
.lines, .arc { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none }
.lines line, .lines rect { fill: none; stroke: var(--tape); stroke-width: 2; vector-effect: non-scaling-stroke }
.lines .in { opacity: .26 }
.lines .out { opacity: .9; stroke-width: 3 }
.free .lines { opacity: .45 }

.top, .play { position: relative }
.top { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: calc(.9 * var(--u)) }
.num { font-family: var(--stencil); font-weight: 800; font-size: calc(7.4 * var(--u)); line-height: 1 }
.jump { --j: calc(3.5 * var(--u)); display: inline-block; width: var(--j); height: calc(var(--j) * 1.4); flex: none; background: currentColor;
  -webkit-mask: var(--logo) 0 calc(var(--j) * -.3) / calc(var(--j) * 2.99) auto no-repeat; mask: var(--logo) 0 calc(var(--j) * -.3) / calc(var(--j) * 2.99) auto no-repeat }
.court.club .lines .out { stroke: var(--star); stroke-width: 6; opacity: 1 }
.court.club .num { color: var(--star) }
.meta { display: grid; justify-items: end; text-align: right; min-width: 0 }
.tag { font-size: calc(2.5 * var(--u)); font-weight: 700; white-space: nowrap }
.tag span { font-weight: 500 }
.time { font-size: calc(2.2 * var(--u)); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap }

.play { display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); min-height: 0; margin-inline: calc(-1.3 * var(--u)) }
.pair { display: grid; align-content: center; gap: calc(1.4 * var(--u)); min-width: 0; padding-inline: calc(1.3 * var(--u)); transition: opacity .6s }
.who { display: grid; min-width: 0 }
.name { font-size: calc(3.7 * var(--u)); font-weight: 700; line-height: 1.04; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.name.long { font-size: calc(3 * var(--u)) }
.name i { font-style: normal; font-weight: 500; text-transform: none }
.who.ours { background: var(--star); color: var(--floor); margin-inline: calc(-1.3 * var(--u)); padding: calc(.5 * var(--u)) calc(1.3 * var(--u));
  grid-template-columns: auto minmax(0, 1fr); column-gap: calc(1 * var(--u)); align-items: center }
.who.ours .jump { grid-row: span 2 }
.pair.win { background: var(--tape); color: var(--floor); animation: flood .9s cubic-bezier(.16, 1, .3, 1) both }
.pair.a.win { --from: inset(100% 0 0 0) }
.pair.b.win { --from: inset(0 0 100% 0) }
.pair.win.ourspair { background: var(--star) }
@keyframes flood { from { clip-path: var(--from) } to { clip-path: inset(0) } }
.info { font-size: calc(2.1 * var(--u)); font-weight: 500; line-height: 1.12; white-space: nowrap; overflow: hidden }
.done .pair.lost { opacity: .5 }
.pair.solo .name { font-size: calc(4.8 * var(--u)) }
.pair.solo .info { font-size: calc(2.5 * var(--u)) }
.reason { color: var(--warn) }

.net { background: var(--floor); display: grid; grid-auto-flow: column; grid-auto-columns: auto; justify-content: space-between; align-items: center;
  gap: calc(1.6 * var(--u)); padding: calc(.5 * var(--u)) calc(2 * var(--u)); min-height: calc(17.2 * var(--u)) }
.clockbox { display: grid; justify-items: start; line-height: 1 }
.elapsed { font-size: calc(3.4 * var(--u)); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap }
.status { font-size: calc(2.1 * var(--u)); font-weight: 500; color: var(--tape-soft); margin-top: calc(.4 * var(--u)) }
.sets { display: flex; align-items: center; gap: calc(1.2 * var(--u)) }
.noscore { justify-content: center }
.noscore .clockbox { justify-items: center }
.noscore .elapsed { font-size: calc(7.6 * var(--u)) }
.noscore .status { font-size: calc(2.6 * var(--u)) }
.done .elapsed { font-size: calc(4.6 * var(--u)) }
.set { display: grid; grid-template-rows: 1fr 1fr; justify-items: center; font-variant-numeric: tabular-nums; perspective: 300px }
.set b { font-weight: 600; font-size: calc(3.4 * var(--u)); color: var(--tape-soft); line-height: 1.2; padding-inline: calc(.2 * var(--u)) }
.set.now b { font-weight: 700; font-size: calc(7.6 * var(--u)); color: var(--tape); line-height: 1.04; min-width: calc(8.4 * var(--u)); text-align: center }
.set b + b { border-top: 2px solid rgba(255, 255, 255, .4); width: 100% ; text-align: center }
.set b.flip { animation: flip .42s cubic-bezier(.16, 1, .3, 1); transform-origin: 50% 50% }
@keyframes flip { from { transform: rotateX(-88deg) } to { transform: rotateX(0) } }
.result { text-align: center; font-size: calc(2.1 * var(--u)); font-weight: 700; text-transform: uppercase }

.freeMark { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(3 * var(--u)); color: var(--tape-soft); text-transform: uppercase; letter-spacing: .06em }
.arc path { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0 }
.arc path.a { stroke: var(--tape); stroke-width: 4 }
.arc path.b { stroke: var(--tape-soft); stroke-width: 2 }
.arc path.go { animation: rally .9s cubic-bezier(.16, 1, .3, 1) }
@keyframes rally { 0% { stroke-dashoffset: 1; opacity: 1 } 60% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: -1; opacity: 0 } }

.assembly { background: var(--floor); display: grid; grid-template-columns: calc(24 * var(--u)) minmax(0, 1.25fr) minmax(0, 3fr); align-items: stretch; min-height: 0; overflow: hidden }
.assembly h2 { margin: 0; align-self: center; font-size: calc(3.5 * var(--u)); font-weight: 700; line-height: 1.02; text-transform: uppercase; padding-inline: calc(1.8 * var(--u)) }
.call { padding: calc(1 * var(--u)) calc(1.6 * var(--u)) calc(1.2 * var(--u)); display: grid; align-content: start; gap: calc(.3 * var(--u)); min-width: 0; height: 100% }
.call .ref { display: flex; justify-content: space-between; align-items: center; gap: calc(1 * var(--u)); font-size: calc(2.2 * var(--u)); white-space: nowrap }
.call .ref b { font-weight: 700; font-size: calc(3.4 * var(--u)); line-height: 1 }
.call .line { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.call .line i { font-style: normal; font-weight: 500; text-transform: none }
.track { display: inline-block; white-space: nowrap }
.slides { text-overflow: clip }
.slides .track { animation: slide var(--slide) ease-in-out infinite }
@keyframes slide { 0%, 18% { transform: translateX(0) } 50%, 68% { transform: translateX(var(--shift)) } 100% { transform: translateX(0) } }
.call .who { display: block; font-size: calc(2.65 * var(--u)); font-weight: 700; line-height: 1.12; text-transform: uppercase; white-space: nowrap; overflow: hidden }
.call .vs { display: block; font-size: calc(1.8 * var(--u)); font-weight: 500; text-transform: none; line-height: 1.1 }
.call .mine { display: inline-flex; align-items: center; gap: calc(.4 * var(--u)); background: var(--star); color: var(--floor); padding-inline: calc(.5 * var(--u)) }
.call .mine .jump { --j: calc(1.6 * var(--u)) }
.call.first { background: var(--tape); color: var(--floor) }
#first { min-width: 0 }
.assembly.idle { grid-template-columns: calc(24 * var(--u)) minmax(0, 1fr) }
.assembly.idle .queue { display: none }
.idleText { margin: 0; display: flex; align-items: center; height: 100%; min-height: calc(13 * var(--u)); padding-inline: calc(2.4 * var(--u)); font-size: calc(4 * var(--u)); font-weight: 600; color: var(--tape-soft) }
.queue { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 0; overflow: hidden }
.queue .call + .call { border-left: 2px solid rgba(255, 255, 255, .28) }
.enter { animation: enter .7s cubic-bezier(.16, 1, .3, 1) }
@keyframes enter { from { clip-path: inset(0 0 100% 0) } to { clip-path: inset(0) } }

.victory { position: fixed; inset: 0; z-index: 20; overflow: hidden; display: grid; place-items: center; color: var(--floor) }
.strip { position: relative }
.link { display: inline-flex; align-items: center; gap: calc(.8 * var(--u)); font-size: calc(2.5 * var(--u)); white-space: nowrap }
.link i { width: calc(1.7 * var(--u)); height: calc(1.7 * var(--u)); border-radius: 50%; background: var(--ok); animation: beat 2s ease-in-out infinite }
.link[data-state="unstable"], .link[data-state="connecting"] { color: var(--warn) }
.link[data-state="unstable"] i, .link[data-state="connecting"] i { background: var(--warn); animation-duration: .7s }
.link[data-state="lost"] i { background: var(--tape); animation: none }
@keyframes beat { 50% { opacity: .35 } }
.alert { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; gap: calc(2 * var(--u)); padding-inline: calc(2.4 * var(--u)); background: var(--lost); color: var(--tape); font-size: calc(3.2 * var(--u)); font-weight: 700 }
.alert[hidden] { display: none }
.alert span { font-weight: 500; font-size: calc(2.5 * var(--u)) }

#snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none }
#snow[hidden], .garland[hidden] { display: none }
.garland { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 7; height: calc(3.2 * var(--u)); display: flex; justify-content: space-between; padding-inline: calc(.8 * var(--u)); pointer-events: none; border-top: 2px solid #2f6b55 }
.garland i { width: calc(1.1 * var(--u)); height: calc(1.5 * var(--u)); border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%; background: var(--c); transform: translateY(var(--y)); animation: twinkle 2.4s var(--d) ease-in-out infinite }
@keyframes twinkle { 50% { opacity: .35 } }
:root[data-season="noel"] .hall { padding-block-start: calc(4 * var(--u)) }
:root[data-season="noel"] .court::before { content: ""; position: absolute; inset: 0 0 auto; height: calc(1.5 * var(--u)); z-index: 1; pointer-events: none;
  background: radial-gradient(circle at 50% 0, var(--tape) 66%, transparent 69%) 0 0 / calc(3.2 * var(--u)) calc(1.5 * var(--u)) repeat-x }
:root[data-season="noel"] .top { padding-block-start: calc(.5 * var(--u)) }
:root[data-season="noel"] .call.first { background: var(--club); color: var(--tape) }

.deer { display: block; aspect-ratio: 240 / 250; color: inherit; flex: none }
.strip .deer { height: calc(8.4 * var(--u)); margin-left: calc(-1 * var(--u)) }
.freeDeer { position: absolute; left: 8%; right: 8%; top: 20%; width: 84%; height: auto; color: var(--tape); opacity: .22 }
.court .freeMark { place-items: end center; padding-bottom: calc(9 * var(--u)) }

.startForm { position: fixed; inset: 0; z-index: 30; background: var(--floor); display: grid; align-content: center; justify-items: center; gap: calc(2.2 * var(--u));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); overflow: auto }
.startForm .deer { height: calc(17 * var(--u)) }
.startForm h1 { font-size: calc(6 * var(--u)); line-height: 1; margin: 0; text-transform: uppercase }
.field { display: grid; gap: calc(1 * var(--u)); width: min(calc(90 * var(--u)), 100%); font-size: calc(2.6 * var(--u)); border: 0; padding: 0; margin: 0; min-width: 0 }
.field input[type="text"], .field input[type="number"] { font: inherit; font-size: calc(3.2 * var(--u)); color: var(--floor); background: var(--tape); border: 0; padding: calc(1.2 * var(--u)) calc(1.6 * var(--u)); width: 100% }
.field legend { padding: 0; margin-bottom: calc(.6 * var(--u)) }
.themes { display: flex; flex-wrap: wrap; gap: calc(1 * var(--u)) }
.themes label { display: inline-flex; align-items: center; gap: calc(.7 * var(--u)); background: var(--mat); padding: calc(.8 * var(--u)) calc(1.8 * var(--u)); cursor: pointer }
.themes input { width: calc(2 * var(--u)); height: calc(2 * var(--u)); accent-color: var(--star) }
.startForm button, .menu { font: inherit; font-weight: 700; cursor: pointer; border: 0 }
.startForm button { font-size: calc(3.4 * var(--u)); background: var(--star); color: var(--floor); padding: calc(1 * var(--u)) calc(5 * var(--u)) }
.startForm :focus-visible, .menu:focus-visible { outline: 3px solid var(--star); outline-offset: 3px }
.startError { margin: 0; color: var(--warn); font-size: calc(2.6 * var(--u)) }
.menu { position: fixed; right: calc(1.6 * var(--u)); bottom: calc(1.6 * var(--u)); z-index: 25; background: var(--tape); color: var(--floor); padding: calc(.7 * var(--u)) calc(1.6 * var(--u)); font-size: calc(2.4 * var(--u)) }

.victory[hidden] { display: none }
.victory::before { content: ""; position: absolute; inset: 0; background: var(--star); clip-path: circle(0 at 50% 46%); animation: gold .9s .52s cubic-bezier(.16, 1, .3, 1) forwards }
@keyframes gold { to { clip-path: circle(130% at 50% 46%) } }
.victory.out { animation: leave .7s cubic-bezier(.7, 0, .84, 0) forwards }
@keyframes leave { to { clip-path: inset(0 0 100% 0) } }
.v-bg { position: absolute; left: 50%; top: 50%; height: 150%; color: #f7bf1e; translate: -50% -50%; animation: loom 7s .5s cubic-bezier(.16, 1, .3, 1) both }
@keyframes loom { from { opacity: 0; scale: .8 } 20% { opacity: 1 } to { opacity: 1; scale: 1.08 } }
.v-deer { height: calc(25 * var(--u)); color: var(--floor); animation: charge .75s .56s cubic-bezier(.16, 1, .3, 1) both, breathe 3s 1.4s ease-in-out infinite }
@keyframes charge { from { opacity: 0; transform: scale(3.2); filter: blur(calc(1.4 * var(--u))) } to { opacity: 1; transform: none; filter: blur(0) } }
@keyframes breathe { 50% { translate: 0 calc(-.7 * var(--u)) } }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1 }
.v-body { position: relative; z-index: 2; display: grid; justify-items: center; text-align: center; gap: calc(1.4 * var(--u)); padding-inline: calc(4 * var(--u)); max-width: 100% }
.v-title { margin: 0; display: flex; font-family: var(--stencil); font-weight: 800; font-size: calc(26 * var(--u)); line-height: .86 }
.v-title span { display: block; opacity: 0; animation: slam .7s calc(.62s + var(--i) * 55ms) cubic-bezier(.16, 1, .3, 1) forwards }
@keyframes slam { from { opacity: 0; transform: translateY(-35%) scale(2.1); filter: blur(calc(1.6 * var(--u))) } to { opacity: 1; transform: none; filter: blur(0) } }
.v-names { margin: 0; font-size: calc(8.4 * var(--u)); font-weight: 700; line-height: 1.05; text-transform: uppercase; clip-path: inset(0 100% 0 0); animation: names .8s 1.25s cubic-bezier(.16, 1, .3, 1) forwards }
@keyframes names { to { clip-path: inset(0 0 0 0) } }
.v-names.many { font-size: calc(5.4 * var(--u)) }
.v-names span { display: block }
.v-line { margin: 0; font-size: calc(4.2 * var(--u)); font-weight: 600; opacity: 0; animation: rise .7s 1.7s cubic-bezier(.16, 1, .3, 1) forwards }
.v-cheer { margin: calc(.8 * var(--u)) 0 0; background: var(--floor); color: var(--star); font-size: calc(5.6 * var(--u)); font-weight: 700; text-transform: uppercase; padding: calc(.3 * var(--u)) calc(2.4 * var(--u)); opacity: 0; animation: rise .7s 2.1s cubic-bezier(.16, 1, .3, 1) forwards }
@keyframes rise { from { opacity: 0; transform: translateY(45%) } to { opacity: 1; transform: none } }

@media (max-aspect-ratio: 1/1) {
  :root { --u: calc(100vw / 86) }
  body { overflow: auto }
  .hall { height: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .strip { flex-wrap: wrap; gap: calc(1.4 * var(--u)) }
  .floor, .courts, .assembly, .queue { grid-template-columns: minmax(0, 1fr); grid-template-rows: none }
  .court { aspect-ratio: 61 / 100 }
  .assembly { order: -1 }
  .assembly h2 { padding-block: calc(1.6 * var(--u)) }
  .queue .call + .call { border-left: 0; border-top: 2px solid rgba(255, 255, 255, .28) }
}
@media (prefers-reduced-motion: reduce) {
  .set b.flip, .enter, .pair.win { animation: none }
  .arc, #fx, #snow { display: none }
  .link i, .garland i, .slides .track { animation: none }
  .victory::before { animation: none; clip-path: none }
  .v-bg, .v-deer { animation: none }
  .v-title span, .v-names, .v-line, .v-cheer { animation: none; opacity: 1; clip-path: none }
  .victory.out { animation: none; opacity: 0 }
  .court { transition: none }
}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="cerf" viewBox="0 0 240 250"><g id="cerfHalf" fill="currentColor">
    <path fill-rule="evenodd" d="M120 104 L96 104 L84 118 L92 160 L103 214 Q110 236 120 236 Z M100 146 L88 134 L108 141 L110 149 Z M120 216 L108 212 L112 222 L120 226 Z"/>
    <path d="M82 114 L38 98 Q44 124 60 130 L86 134 Z"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="11" d="M100 102 C96 80 74 80 62 62 C52 46 54 28 64 8"/>
      <path stroke-width="9" d="M84 82 C72 86 54 84 38 70"/>
      <path stroke-width="9" d="M62 62 C48 62 32 54 20 36"/>
      <path stroke-width="8" d="M56 38 C46 34 40 24 38 12"/>
      <path stroke-width="8" d="M62 34 C72 32 82 26 88 14"/>
    </g></g>
    <use href="#cerfHalf" transform="matrix(-1 0 0 1 240 0)"/>
  </symbol>
</defs></svg>
<form class="startForm" id="start" novalidate hidden>
  <svg class="deer" aria-hidden="true"><use href="#cerf"/></svg>
  <h1>Écran de salle</h1>
  <label class="field">Numéro du tournoi ou lien Badnet
    <input type="text" name="tournament" id="tournament" autocomplete="off" placeholder="51180">
  </label>
  <p class="startError" id="startError" role="alert" hidden>Entrez un numéro de tournoi ou un lien Badnet contenant eventid.</p>
  <label class="field">Nombre de terrains
    <input type="number" name="courts" min="1" max="12" value="5">
  </label>
  <fieldset class="field">
    <legend>Thème</legend>
    <div class="themes">
      <label><input type="radio" name="theme" value="auto" checked> Automatique</label>
      <label><input type="radio" name="theme" value="classique"> Classique</label>
      <label><input type="radio" name="theme" value="noel"> Noël</label>
    </div>
  </fieldset>
  <button type="submit">Démarrer</button>
</form>
<button class="menu" id="menu" type="button" hidden>Réglages</button>

<script>// Start screen and settings. Settings live in the address, and in this TV's
// storage so a reload or power cut comes straight back to the live screen.
(() => {
  const KEY = "ecran-salle";
  const THEMES = ["auto", "classique", "noel"];
  const DEFAULT_COURTS = 5, MAX_COURTS = 12, MENU_MS = 5000;

  function eventFrom(value) {
    const text = String(value ?? "").trim();
    return /^\d+$/.test(text) ? text : text.match(/[?&](?:eventid|event)=(\d+)/)?.[1] ?? null;
  }

  function readStored() {
    try { return JSON.parse(localStorage.getItem(KEY)) ?? {}; } catch { return {}; }
  }
  function store(value) {
    try { localStorage.setItem(KEY, JSON.stringify(value)); } catch { /* blocked storage: the address still holds the settings */ }
  }

  function readSettings() {
    const query = new URLSearchParams(location.search);
    const stored = readStored();
    const courts = Number(query.get("terrains") ?? stored.courts ?? DEFAULT_COURTS);
    const theme = query.get("theme") ?? stored.theme;
    return {
      eventId: eventFrom(query.get("event") ?? stored.eventId),
      courts: Number.isInteger(courts) && courts >= 1 && courts <= MAX_COURTS ? courts : DEFAULT_COURTS,
      theme: THEMES.includes(theme) ? theme : "auto",
    };
  }

  const settings = readSettings();
  window.ECRAN_CONFIG = { courts: settings.courts, theme: settings.theme };

  function showForm() {
    const form = document.getElementById("start");
    form.elements.tournament.value = settings.eventId ?? "";
    form.elements.courts.value = settings.courts;
    form.elements.theme.value = settings.theme;
    form.hidden = false;
    form.elements.tournament.focus();
  }

  function bindForm() {
    const form = document.getElementById("start");
    const error = document.getElementById("startError");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const eventId = eventFrom(form.elements.tournament.value);
      if (!eventId) {
        error.hidden = false;
        form.elements.tournament.focus();
        return;
      }
      const next = { eventId, courts: Number(form.elements.courts.value), theme: form.elements.theme.value };
      store(next);
      location.assign(`${location.pathname}?event=${eventId}&terrains=${next.courts}&theme=${next.theme}`);
    });
    form.elements.tournament.addEventListener("input", () => { error.hidden = true; });
    const menu = document.getElementById("menu");
    let hide;
    addEventListener("pointermove", () => {
      if (!form.hidden) return;
      menu.hidden = false;
      clearTimeout(hide);
      hide = setTimeout(() => { menu.hidden = true; }, MENU_MS);
    });
    menu.addEventListener("click", showForm);
    addEventListener("keydown", (event) => { if (event.key === "Escape" && form.hidden) showForm(); });
  }

  window.EcranStart = {
    begin() {
      bindForm();
      if (!settings.eventId) { showForm(); return; }
      store(settings);
      const screen = window.EcranSalle;
      const savedKey = `${KEY}-${settings.eventId}`;
      let saved = {};
      try { saved = JSON.parse(sessionStorage.getItem(savedKey)) ?? {}; } catch { /* starts empty */ }
      let send = () => {};
      const tracker = window.EcranFeed.createTracker(screen, {
        eventId: settings.eventId,
        send: (event) => send(event),
        saved,
        save: (state) => { try { sessionStorage.setItem(savedKey, JSON.stringify(state)); } catch { /* keeps running */ } },
      });
      tracker.start();
      send = window.EcranFeed.connectFeed(tracker, screen);
    },
  };
})();
</script>
<script>// Turns the ScorBad feed into calls on the screen API. There is no server: the
// TV connects straight to the Socket.IO feed. The feed sends changes, not a full
// state, so `createTracker` keeps the picture and `connectFeed` only moves bytes.
(() => {
  const HOLD_MS = 7000, CLUB_HOLD_MS = 12000, NO_RESULT_MS = 4000, SETTLED_MS = 10000;
  const PING_MS = 10000, RETRY_MIN_MS = 2000, RETRY_MAX_MS = 30000;
  const URL = "wss://socket.scorbad.fr/socket.io/?EIO=3&transport=websocket";

  const text = (html) => String(html ?? "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
  const courtNumber = (value, courts) => {
    const n = Number(value);
    return Number.isInteger(n) && n >= 1 && n <= courts ? n : null;
  };

  function parseSets(score) {
    return String(score ?? "").trim().split(/\s+/).filter(Boolean)
      .map((set) => set.split("-").map(Number))
      .filter((set) => set.length === 2 && set.every(Number.isFinite));
  }

  // "<p>MARTIN Léa<span>Sen - N2 - OFPBAD54</span></p>..."
  function parsePairHtml(html) {
    return [...String(html ?? "").matchAll(/<p>([^<]*)<span>([^<]*)<\/span><\/p>/g)]
      .map((m) => ({ n: m[1].trim(), i: m[2].trim() }));
  }

  // One organiser row from event_updatelive.
  function parseRow(html) {
    const num = Number(html.match(/class="live-nummatch">(\d+)/)?.[1]);
    if (!num) return null;
    const sides = html.split(/class="live-pair /).slice(1).map((part) =>
      [...part.matchAll(/class="[^"]*\bplayer\b[^"]*"[^>]*>([^<]*)<\/a>/g)].map((m) => {
        const [n, ...info] = m[1].split(" - ");
        return { n: n.trim(), i: info.join(" - ").trim() };
      }));
    return {
      num,
      status: html.match(/class="line-match ?([^"]*)"/)?.[1].trim() ?? "",
      court: Number(html.match(/class="live-terrain">(\d+)/)?.[1] ?? 0),
      draw: text(html.match(/live-drawname[^>]*>([^<]*)/)?.[1]),
      round: text(html.match(/class="live-step">([^<]*)/)?.[1]),
      a: sides[0] ?? [],
      b: sides[1] ?? [],
    };
  }

  function createTracker(screen, { eventId, courts, send = () => {}, setTimer = setTimeout, now = Date.now, saved = {}, save = () => {} }) {
    const id = Number(eventId);
    const onCourt = new Map();    // match number -> { court, match, pair1, pair2, left }
    const results = new Set();
    const details = new Map(saved.details ?? []);   // player name -> "Sen - N2 - OFPBAD54"
    let upcoming = new Map(saved.upcoming ?? []);
    let nextNumber = saved.nextNumber ?? 0;
    let connectedAt = now();
    let subscribed = new Set();
    let title = "", drift = saved.drift ?? "";

    const persist = () => save({ details: [...details], upcoming: [...upcoming], nextNumber, drift });
    const showHeader = () => screen.setHeader({ title, drift });
    const enrich = (p) => ({ ...p, i: details.get(p.n) ?? p.i });

    function player(p) {
      if (!p) return null;
      const n = `${p.familyname} ${p.firstname}`;
      const age = p.member?.catage?.nameshort;
      return { n, i: details.get(n) ?? [age, p.team].filter(Boolean).join(" - ") };
    }
    const side = (pair) => [player(pair?.player1), player(pair?.player2)].filter(Boolean);

    function showQueue(animate) {
      const list = [...upcoming.values()]
        .filter((m) => m.num >= nextNumber && !results.has(m.num))
        .sort((x, y) => x.num - y.num)
        .map((m) => ({ ...m, a: m.a.map(enrich), b: m.b.map(enrich) }));
      screen.setQueue(list, animate);
    }

    function subscribe(m) {
      if (subscribed.has(m.number)) return;
      subscribed.add(m.number);
      send(["livescore", { eventid: id, match: m.number, base: m.baseid, court: m.court }]);
    }

    function onMatch(m) {
      if (m.eventid !== id) return;
      if (m.eventname && m.eventname !== title) { title = m.eventname; showHeader(); }
      const court = courtNumber(m.court, screen.courts);
      if (!court || results.has(m.number)) return;
      subscribe(m);
      if (upcoming.delete(m.number)) { showQueue(true); persist(); }
      const known = onCourt.get(m.number);
      const score = m.score ? parseSets(m.score.score) : null;
      if (known?.court === court) return;
      for (const [num, other] of onCourt) if (other.court === court) onCourt.delete(num);
      const flipped = score && String(m.score.pair_left) !== String(m.pair1?.id);
      const justStarted = now() - connectedAt > SETTLED_MS;
      const match = {
        num: m.number, draw: m.label, round: m.round,
        dur: m.score?.length ?? (justStarted ? 0 : null),
        a: side(m.pair1), b: side(m.pair2),
        sets: score ? score.map((s) => (flipped ? [s[1], s[0]] : s)) : null,
      };
      onCourt.set(m.number, { court, match, pair1: String(m.pair1?.id), pair2: String(m.pair2?.id) });
      screen.setCourt(court, match);
    }

    function onScore(s) {
      const known = onCourt.get(s.match);
      if (!known) return;
      const flipped = String(s.pair_left) !== known.pair1;
      const sets = parseSets(s.score).map((x) => (flipped ? [x[1], x[0]] : x));
      const before = known.match.sets?.at(-1);
      const last = sets.at(-1);
      const changed = before && last ? [0, 1].find((i) => last[i] !== before[i]) : undefined;
      known.match.sets = sets;
      known.match.dur = s.length ?? known.match.dur;
      if (sets.length) screen.setScore(known.court, sets, changed ?? null);
    }

    function clearLater(num, hold) {
      setTimer(() => {
        const known = onCourt.get(num);
        if (!known) return;
        onCourt.delete(num);
        screen.setCourt(known.court, null);
      }, hold);
    }

    function onFin(f) {
      const known = onCourt.get(f.match);
      if (!known || results.has(f.match)) return;
      results.add(f.match);
      const winner = String(f.pair_win) === known.pair1 ? 0 : String(f.pair_win) === known.pair2 ? 1 : null;
      const pair = winner === 0 ? known.match.a : winner === 1 ? known.match.b : [];
      screen.endMatch(known.court, { winner, final: f.score ?? null });
      clearLater(f.match, pair.some(screen.isOurs) ? CLUB_HOLD_MS : HOLD_MS);
    }

    // delmatch comes just before fin. Without fin, the match was simply withdrawn.
    function onDelete(d) {
      setTimer(() => {
        if (!results.has(d.match) && onCourt.has(d.match)) clearLater(d.match, 0);
      }, NO_RESULT_MS);
    }

    function onCurrent(items) {
      for (const { html } of items) {
        if (!html || typeof html !== "object") continue;
        for (const p of [...parsePairHtml(html.pair1), ...parsePairHtml(html.pair2)]) details.set(p.n, p.i);
        const known = onCourt.get(html.num);
        if (!known) continue;
        known.match.a = known.match.a.map(enrich);
        known.match.b = known.match.b.map(enrich);
        if (html.duration != null) known.match.dur = html.duration;
        screen.setCourt(known.court, known.match);
      }
      persist();
    }

    function onRows(rows) {
      let changed = false;
      for (const row of rows) {
        if (typeof row.html !== "string") continue;
        const parsed = parseRow(row.html);
        if (!parsed) continue;
        for (const p of [...parsed.a, ...parsed.b]) if (p.i) details.set(p.n, p.i);
        const waiting = !parsed.court && parsed.status !== "match-end";
        if (waiting) { upcoming.set(parsed.num, parsed); changed = true; }
        else if (upcoming.delete(parsed.num)) changed = true;
      }
      if (changed) showQueue(false);
      persist();
    }

    function onUpdate(p) {
      if (p.data?.late && p.data.late !== drift) { drift = p.data.late; showHeader(); }
      if (Array.isArray(p.data?.matchs)) onRows(p.data.matchs);
    }

    return {
      opened() {
        connectedAt = now();
        subscribed = new Set();
        send(["join_matchlive"]);
        send(["matchs"]);
        send(["join_event", String(id)]);
      },
      handle(name, payload) {
        if (!payload || typeof payload !== "object") return;
        if (name === "matchlive" || name === "match" || name === "dispatchmatch") { onMatch(payload); return; }
        if ((payload.event ?? payload.eventid) !== id) return;
        if (name === "score" || name === "back") onScore(payload);
        else if (name === "fin") onFin(payload);
        else if (name === "delmatch") onDelete(payload);
        else if (name === "event_updatelive") onUpdate(payload);
        else if (name === "event_nextmatchs" && Array.isArray(payload.data?.matchs)) onRows(payload.data.matchs);
        else if (name === "event_currentmatchs" && Array.isArray(payload.matchs)) onCurrent(payload.matchs);
        else if (name === "event_nextmatchnum") {
          nextNumber = Number(payload.num) || nextNumber;
          showQueue(true);
          persist();
        }
      },
      start() { showHeader(); showQueue(false); },
    };
  }

  function connectFeed(tracker, screen) {
    let socket, ping, retry = RETRY_MIN_MS;
    const emit = (event) => { if (socket?.readyState === WebSocket.OPEN) socket.send(`42${JSON.stringify(event)}`); };

    function open() {
      socket = new WebSocket(URL);
      socket.onmessage = ({ data }) => {
        const message = String(data);
        retry = RETRY_MIN_MS;
        screen.heartbeat();
        if (message === "40") tracker.opened();
        else if (message.startsWith("42")) {
          try { tracker.handle(...JSON.parse(message.slice(2))); } catch (error) { console.error(error); }
        }
      };
      // Our own pings prove the hotspot works even when no match is moving.
      ping = setInterval(() => { if (socket.readyState === WebSocket.OPEN) socket.send("2"); }, PING_MS);
      socket.onclose = () => {
        clearInterval(ping);
        setTimeout(open, retry);
        retry = Math.min(retry * 2, RETRY_MAX_MS);
      };
    }
    open();
    return emit;
  }

  const api = { createTracker, connectFeed, parseSets, parseRow, parsePairHtml };
  if (typeof module !== "undefined") module.exports = api;
  else window.EcranFeed = api;
})();
</script>
<script>// Hall display. It holds no tournament data and no game rules: a data source
// drives it only through window.EcranSalle (see README.md).
(() => {
  const CONFIG = { courts: 5, clubs: ["CSJBAD57", "Cercle St Jean - Badminton"], theme: "auto", ...window.ECRAN_CONFIG };
  const STALE_MS = 15000, LOST_MS = 45000;
  const VICTORY_MS = 7200, MAX_VICTORY_WAIT_MS = 120000, MAX_VICTORIES_SHOWN = 3;
  const SOFT_FIT = .88, MIN_FIT = .6, SLIDE_PX_PER_S = 45, SLIDE_PAUSES_S = 5;

  const LINES = `<svg class="lines" viewBox="0 0 610 1340" preserveAspectRatio="none" aria-hidden="true">
    <rect class="out" x="1.5" y="1.5" width="607" height="1337"/>
    <line class="in" x1="46" y1="0" x2="46" y2="1340"/><line class="in" x1="564" y1="0" x2="564" y2="1340"/>
    <line class="in" x1="0" y1="76" x2="610" y2="76"/><line class="in" x1="0" y1="1264" x2="610" y2="1264"/>
    <line class="in" x1="0" y1="472" x2="610" y2="472"/><line class="in" x1="0" y1="868" x2="610" y2="868"/>
    <line class="in" x1="305" y1="0" x2="305" y2="472"/><line class="in" x1="305" y1="868" x2="305" y2="1340"/>
  </svg>`;
  const ARC = `<svg class="arc" viewBox="0 0 610 1340" preserveAspectRatio="none" aria-hidden="true">
    <path class="a" pathLength="1" d=""/><path class="b" pathLength="1" d=""/></svg>`;
  const MARK = `<span class="jump" role="img" aria-label="Joueur du club"></span>`;
  const REASONS = { wo: "Forfait", ab: "Abandon" };
  const IDLE = {
    before: "Les matchs n'ont pas encore commencé",
    live: "Prochains matchs bientôt affichés",
    after: "Fin des matchs. Merci et à bientôt !",
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const random = (n) => Math.floor(Math.random() * n);
  const clockText = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  function isChristmas(d = new Date()) {
    if (location.hash === "#noel" || CONFIG.theme === "noel") return true;
    if (location.hash === "#classique" || CONFIG.theme === "classique") return false;
    return d.getMonth() === 11 || (d.getMonth() === 0 && d.getDate() <= 6);
  }
  const NOEL = isChristmas();
  if (NOEL) document.documentElement.dataset.season = "noel";

  function short(full) {
    const parts = String(full ?? "").trim().split(/\s+/);
    const first = parts.findIndex((p) => p !== p.toUpperCase());
    const family = parts.slice(0, first < 0 ? parts.length : first).join(" ");
    const given = first < 0 ? "" : parts.slice(first).join(" ");
    return { family, given };
  }
  const isOurs = (p) => {
    const info = String(p?.i ?? "").trim();
    return CONFIG.clubs.some((club) => info.endsWith(club));
  };
  const players = (m) => [...(m.a ?? []), ...(m.b ?? [])];
  const hasOurs = (m) => players(m).some(isOurs);

  // A long name shrinks a little, then slides to show its end and comes back.
  // Without motion it shrinks further and the CSS ellipsis takes over.
  function fit(el) {
    const track = el.querySelector(".track");
    el.style.fontSize = "";
    el.classList.remove("slides");
    if (!track || track.offsetWidth <= el.clientWidth) return;
    const size = parseFloat(getComputedStyle(el).fontSize);
    const ratio = el.clientWidth / track.offsetWidth;
    const still = reducedMotion();
    el.style.fontSize = `${size * Math.max(still ? MIN_FIT : SOFT_FIT, ratio)}px`;
    const excess = track.offsetWidth - el.clientWidth;
    if (still || excess <= 0) return;
    el.style.setProperty("--shift", `${-excess}px`);
    el.style.setProperty("--slide", `${(excess * 2) / SLIDE_PX_PER_S + SLIDE_PAUSES_S}s`);
    el.classList.add("slides");
  }
  const fitAll = (root) => root.querySelectorAll(".name, .call .line").forEach(fit);

  function playerRow(p) {
    const { family, given } = short(p.n);
    const ours = isOurs(p);
    return `<div class="who ${ours ? "ours" : ""}">${ours ? MARK : ""}<span class="name"><span class="track">${esc(family)} <i>${esc(given)}</i></span></span><span class="info">${esc(String(p.i ?? "").replaceAll(" - ", " · "))}</span></div>`;
  }
  const pairRow = (list, cls) => `<div class="pair ${cls} ${list.length === 1 ? "solo" : ""}">${list.map(playerRow).join("")}</div>`;

  const courts = Array.from({ length: CONFIG.courts }, (_, i) => ({ no: i + 1, match: null, state: "free", el: null }));
  const courtOf = (no) => courts[no - 1];
  let queue = [];
  let phase = "live";

  function setRows(sets) {
    return sets.map((s, i) => `<div class="set ${i === sets.length - 1 ? "now" : ""}"><b>${s[0]}</b><b>${s[1]}</b></div>`).join("");
  }

  function netBand(c) {
    const m = c.match;
    const done = c.state === "done";
    const label = done ? REASONS[m.reason] ?? "Terminé" : m.dur == null ? "En cours" : `${m.dur} min`;
    const detail = done ? m.final ?? "" : m.dur == null ? "" : "En cours";
    const clock = `<div class="clockbox"><span class="elapsed ${m.reason ? "reason" : ""}">${esc(label)}</span>${detail ? `<span class="status">${esc(detail)}</span>` : ""}</div>`;
    return m.sets && !done
      ? `<div class="net">${clock}<div class="sets">${setRows(m.sets)}</div></div>`
      : `<div class="net noscore">${clock}</div>`;
  }

  function renderCourt(c) {
    const el = c.el;
    el.className = `court ${c.state} ${c.match && hasOurs(c.match) ? "club" : ""}`;
    if (c.state === "free") {
      el.innerHTML = `${LINES}<div class="top"><span class="num">${c.no}</span></div><svg class="deer freeDeer" aria-hidden="true"><use href="#cerf"/></svg><div class="freeMark">Libre</div>`;
      return;
    }
    const m = c.match;
    const result = (side) => {
      if (c.state !== "done" || m.winner == null) return "";
      if (m.winner !== side) return "lost";
      return `win ${(side === 0 ? m.a : m.b).some(isOurs) ? "ourspair" : ""}`;
    };
    el.innerHTML = `${LINES}${ARC}
      <div class="top"><span class="num">${c.no}</span><span></span>
        <div class="meta"><span class="tag">${esc(m.draw)} <span>${m.draw ? "· " : ""}N° ${esc(m.num)}</span></span>
        <span class="time">${esc(m.round)}</span></div></div>
      <div class="play">${pairRow(m.a ?? [], "a " + result(0))}${netBand(c)}${pairRow(m.b ?? [], "b " + result(1))}</div>`;
    fitAll(el);
  }

  function callRow(m, first) {
    const names = (pair) => (pair ?? []).map((x) => {
      const { family, given } = short(x.n);
      const name = `${esc(family)} <i>${esc(given)}</i>`;
      return isOurs(x) ? `<span class="mine">${MARK}${name}</span>` : name;
    }).join(" / ");
    return `<div class="call ${first ? "first" : ""}">
      <div class="ref"><span>${esc(m.draw)} · ${esc(m.round)}</span><b>N° ${esc(m.num)}</b></div>
      <div class="who"><span class="line"><span class="track">${names(m.a)}</span></span><span class="vs">contre</span><span class="line"><span class="track">${names(m.b)}</span></span></div>
    </div>`;
  }

  function renderQueue(animate) {
    const band = document.querySelector(".assembly");
    band.classList.toggle("idle", queue.length === 0);
    $("first").innerHTML = queue[0] ? callRow(queue[0], true) : `<p class="idleText">${esc(IDLE[phase])}</p>`;
    $("queue").innerHTML = queue.slice(1, 4).map((m) => callRow(m, false)).join("");
    if (animate) $("first").firstElementChild?.classList.add("enter");
    fitAll(band);
  }

  function rally(c, side) {
    const paths = c.el.querySelectorAll(".arc path");
    const from = side === 0 ? 1180 : 160, to = 1340 - from;
    const x = 90 + random(430), end = 90 + random(430);
    paths.forEach((p, i) => {
      p.setAttribute("d", `M${x} ${from} Q${i ? 40 : -40} 670 ${end} ${to}`);
      p.classList.remove("go");
      p.getBoundingClientRect();
      p.classList.add("go");
    });
  }

  function setScore(no, sets, side) {
    const c = courtOf(no);
    if (!c?.match || c.state !== "live") return;
    const before = c.match.sets;
    c.match.sets = sets;
    if (!before || before.length !== sets.length) { renderCourt(c); return; }
    if (side == null) return;
    rally(c, side);
    const cell = c.el.querySelectorAll(".set.now b")[side];
    cell.textContent = sets[sets.length - 1][side];
    cell.classList.remove("flip");
    cell.getBoundingClientRect();
    cell.classList.add("flip");
  }

  function setCourt(no, match) {
    const c = courtOf(no);
    if (!c) return;
    c.match = match ? { ...match } : null;
    c.state = match ? "live" : "free";
    renderCourt(c);
  }

  // Each match ends once, whatever the feed repeats. A forfeit or retirement is
  // recorded on the court but never celebrated.
  const ended = new Set();
  function endMatch(no, { winner = null, final = null, reason = null } = {}) {
    const c = courtOf(no);
    const m = c?.match;
    if (!m || ended.has(m.num)) return;
    ended.add(m.num);
    Object.assign(m, { winner, final, reason });
    c.state = "done";
    renderCourt(c);
    const pair = winner == null ? null : winner === 0 ? m.a : m.b;
    if (pair?.some(isOurs) && !reason) celebrate({ court: c.no, m, pair });
  }

  let pending = [];
  let celebrating = false;

  function celebrate(entry) {
    pending.push({ ...entry, at: Date.now() });
    if (!celebrating) nextVictory();
  }

  // Wins that pile up share one screen, so the courts are never hidden for long.
  function nextVictory() {
    const fresh = pending.filter((e) => Date.now() - e.at < MAX_VICTORY_WAIT_MS);
    pending = [];
    celebrating = fresh.length > 0;
    if (!celebrating) return;
    const box = $("victory");
    const shown = fresh.slice(0, MAX_VICTORIES_SHOWN);
    const hiddenCount = fresh.length - shown.length;
    const word = fresh.length > 1 ? "VICTOIRES" : "VICTOIRE";
    const letters = [...word].map((l, i) => `<span style="--i:${i}">${l}</span>`).join("");
    const names = shown.map((e) => `<span>${esc(e.pair.map((p) => p.n).join(" & "))}</span>`).join("");
    const only = fresh[0];
    const detail = fresh.length === 1
      ? `Terrain ${only.court} · ${esc(only.m.draw)}${only.m.final ? ` · ${esc(only.m.final)}` : ""}`
      : hiddenCount ? `Et ${hiddenCount} autre${hiddenCount > 1 ? "s" : ""}` : "";
    box.className = "victory";
    box.innerHTML = `<svg class="deer v-bg" aria-hidden="true"><use href="#cerf"/></svg><canvas id="fx" aria-hidden="true"></canvas><div class="v-body">
      <svg class="deer v-deer" role="img" aria-label="Le cerf, totem du club"><use href="#cerf"/></svg>
      <h2 class="v-title" aria-label="${word}">${letters}</h2>
      <p class="v-names ${fresh.length > 1 ? "many" : ""}">${names}</p>
      ${detail ? `<p class="v-line">${detail}</p>` : ""}
      <p class="v-cheer">Allez Augny !</p></div>`;
    box.hidden = false;
    if (!reducedMotion()) launchShuttle(box.querySelector("#fx"));
    setTimeout(() => box.classList.add("out"), VICTORY_MS - 700);
    setTimeout(() => { box.hidden = true; box.innerHTML = ""; nextVictory(); }, VICTORY_MS);
  }

  // The shuttle crosses the hall along the logo's trajectory, then bursts into feathers.
  function launchShuttle(canvas) {
    const w = canvas.width = innerWidth, h = canvas.height = innerHeight;
    const ctx = canvas.getContext("2d");
    const start = performance.now();
    const flight = 560, life = VICTORY_MS - 500;
    const hit = { x: w * .5, y: h * .46 };
    const curve = (t, lift) => {
      const a = (1 - t) * (1 - t), b = 2 * t * (1 - t), d = t * t;
      return { x: a * -w * .08 + b * w * .2 + d * hit.x, y: a * h * .98 + b * (h * .02 + lift) + d * hit.y };
    };
    const colours = NOEL ? ["#ffffff", "#c8102e", "#0f5c43", "#ffffff"] : ["#ffffff", "#0080f4", "#ffffff"];
    const feathers = [];
    function burst(count, speed) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2, v = speed * (.25 + Math.random());
        feathers.push({ x: hit.x, y: hit.y, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v, r: Math.random() * 6, spin: (Math.random() - .5) * .16,
          size: (9 + Math.random() * 15) * h / 1080 * 1.6, sway: Math.random() * 6, colour: colours[i % colours.length], born: performance.now() });
      }
    }
    function feather(f, alpha) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.r);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = f.colour;
      ctx.beginPath();
      ctx.moveTo(0, -f.size);
      ctx.quadraticCurveTo(f.size * .62, -f.size * .1, 0, f.size * .72);
      ctx.quadraticCurveTo(-f.size * .62, -f.size * .1, 0, -f.size);
      ctx.fill();
      ctx.fillRect(-.8, f.size * .5, 1.6, f.size * .7);
      ctx.restore();
    }
    let burstDone = false;
    function frame(now) {
      if (!canvas.isConnected) return;
      const t = now - start;
      ctx.clearRect(0, 0, w, h);
      if (t < flight + 200) {
        const head = 1 - Math.pow(1 - Math.min(t / flight, 1), 2.4);
        const fade = t > flight ? 1 - (t - flight) / 200 : 1;
        [[0, 9, "#ffffff"], [h * .05, 5, "#0080f4"], [h * .1, 3, "#cfe5ff"]].forEach(([lift, width, stroke]) => {
          ctx.globalAlpha = fade;
          ctx.strokeStyle = stroke;
          ctx.lineWidth = width * h / 1080 * 1.6;
          ctx.lineCap = "round";
          ctx.beginPath();
          for (let i = 0; i <= 40; i++) {
            const p = curve(head * i / 40, lift * (1 - i / 40));
            i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
          }
          ctx.stroke();
        });
        if (t < flight) {
          const tip = curve(head, 0), tail = curve(Math.max(0, head - .02), 0);
          const size = h * .03;
          ctx.save();
          ctx.translate(tip.x, tip.y);
          ctx.rotate(Math.atan2(tip.y - tail.y, tip.x - tail.x));
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.moveTo(-size * .2, -size * .24);
          ctx.lineTo(-size * 1.8, -size * .72);
          ctx.lineTo(-size * 1.8, size * .72);
          ctx.lineTo(-size * .2, size * .24);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 0, size * .34, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }
      if (t >= flight && !burstDone) { burstDone = true; burst(240, h * .03); }
      if (t > flight && t < flight + 900) {
        const k = (t - flight) / 900, ease = 1 - Math.pow(1 - k, 3);
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = (1 - k) * h * .06;
        ctx.beginPath();
        ctx.arc(hit.x, hit.y, ease * Math.hypot(w, h) * .55, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      for (const f of feathers) {
        const age = (now - f.born) / 1000;
        f.vx *= .972;
        f.vy = f.vy * .972 + h * .00016;
        f.x += f.vx + Math.sin(age * 2.4 + f.sway) * h * .0016;
        f.y += f.vy;
        f.r += f.spin;
        feather(f, Math.min(1, (life - t) / 900));
      }
      if (t < life) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // A hotspot can stay "connected" with no traffic, so the link is judged on the age of the last data.
  const openedAt = Date.now();
  let lastData = null;

  function watchLink() {
    const age = Date.now() - (lastData ?? openedAt);
    const offline = !navigator.onLine || age > LOST_MS;
    const state = offline ? "lost" : lastData == null ? "connecting" : age > STALE_MS ? "unstable" : "live";
    $("link").dataset.state = state;
    $("linkText").textContent = { live: "En direct", unstable: "Réseau instable", lost: "Hors ligne", connecting: "Connexion…" }[state];
    const alert = $("alert");
    alert.hidden = !offline;
    if (!offline) return;
    const minutes = Math.floor(age / 60000);
    const since = minutes ? `depuis ${minutes} min · ` : "";
    alert.innerHTML = lastData == null
      ? `Connexion impossible <span>${since}vérifiez le partage de connexion · reprise automatique</span>`
      : `Connexion perdue <span>${since}dernières données à ${clockText(new Date(lastData))} · reprise automatique dès le retour du réseau</span>`;
  }

  function startChristmas() {
    const garland = $("garland");
    const colours = ["#e8112d", "#ffd23f", "#3ddc84", "#ffffff"];
    garland.innerHTML = Array.from({ length: 46 }, (_, i) => {
      const sag = Math.abs(Math.sin(i * Math.PI / 6));
      return `<i style="--c:${colours[i % 4]};--d:${(i % 5) * 300}ms;--y:calc(${(sag * 1.3).toFixed(2)} * var(--u))"></i>`;
    }).join("");
    garland.hidden = false;
    if (reducedMotion()) return;
    const canvas = $("snow");
    canvas.hidden = false;
    const w = canvas.width = innerWidth, h = canvas.height = innerHeight;
    const ctx = canvas.getContext("2d");
    const flakes = Array.from({ length: 70 }, () => ({ x: Math.random() * w, y: Math.random() * h, r: h / 1080 * (1.5 + Math.random() * 3.5), v: h / 1080 * (.5 + Math.random()), p: Math.random() * 6 }));
    ctx.fillStyle = "#ffffff";
    (function fall(now) {
      ctx.clearRect(0, 0, w, h);
      for (const f of flakes) {
        f.y += f.v;
        f.x += Math.sin(now / 1400 + f.p) * .5;
        if (f.y > h) { f.y = -8; f.x = Math.random() * w; }
        ctx.globalAlpha = .75;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(fall);
    })(performance.now());
  }

  // Unattended TV: ask the browser to keep the display on, and ask again after
  // the lock is dropped. It needs HTTPS; without it the screen simply runs on.
  async function keepAwake() {
    if (!navigator.wakeLock || document.visibilityState !== "visible") return;
    try {
      const lock = await navigator.wakeLock.request("screen");
      lock.addEventListener("release", () => setTimeout(keepAwake, 1000));
    } catch { /* refused by the browser or power settings */ }
  }

  function clock() { $("clock").textContent = clockText(new Date()); }

  document.documentElement.style.setProperty("--courts", CONFIG.courts);
  const host = $("courts");
  for (const c of courts) {
    c.el = document.createElement("section");
    host.append(c.el);
    renderCourt(c);
  }
  renderQueue(false);
  if (NOEL) startChristmas();
  clock();
  watchLink();
  setInterval(clock, 10000);
  setInterval(watchLink, 1000);
  setInterval(() => {
    for (const c of courts) {
      if (c.state !== "live" || c.match.dur == null) continue;
      c.match.dur++;
      c.el.querySelector(".elapsed").textContent = `${c.match.dur} min`;
    }
  }, 60000);
  addEventListener("online", watchLink);
  addEventListener("offline", watchLink);
  document.addEventListener("visibilitychange", keepAwake);
  keepAwake();
  document.fonts?.ready.then(() => { fitAll(document.body); });

  window.EcranSalle = {
    courts: CONFIG.courts,
    isOurs,
    setHeader({ title = "", drift = "" }) {
      $("title").textContent = title;
      $("drift").textContent = drift;
      $("drift").hidden = !drift;
    },
    setPhase(next) { phase = next; renderQueue(false); },
    setCourt,
    setScore,
    endMatch,
    setQueue(list, animate = false) { queue = list; renderQueue(animate); },
    heartbeat() { lastData = Date.now(); watchLink(); },
  };
})();
</script>
<script>EcranStart.begin();</script>
</body>
